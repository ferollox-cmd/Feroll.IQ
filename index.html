<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feroll.IQ — Мессенджер</title>
<style>
  :root {
    --bg:#0e1621; --sidebar:#17212b; --chat-bg:#0e1621; --header:#17212b;
    --bubble-in:#182533; --bubble-out:#2b5278; --accent:#5288c1;
    --text:#fff; --muted:#6c7883; --border:#101921; --hover:#202b36;
    --gold:#f5b642; --green:#4dcd5e; --red:#ff3b30;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2b3a4a;border-radius:3px}
  .app{display:flex;width:100%;height:100vh}

  /* SIDEBAR */
  .sidebar{width:400px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .side-header{padding:10px 16px;display:flex;align-items:center;gap:10px;height:60px}
  .menu-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:8px;border-radius:50%;transition:.2s}
  .menu-btn:hover{background:var(--hover);color:#fff}
  .side-title{font-weight:700;font-size:18px;flex:1}
  .star-balance{display:flex;align-items:center;gap:4px;background:var(--hover);padding:6px 12px;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .star-balance:hover{background:#2b3a4a}.star-balance .star-ico{color:var(--gold);font-size:14px}
  .add-btn{background:linear-gradient(135deg,#6c5ce7,#00d4ff);border:none;color:#fff;font-size:20px;font-weight:700;width:36px;height:36px;border-radius:12px;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px rgba(108,92,231,.4);transition:.2s}
  .add-btn:hover{transform:scale(1.08) rotate(90deg)}

  .search-box{padding:0 16px 10px}
  .search-box input{width:100%;padding:10px 16px;border-radius:20px;border:none;background:#242f3d;color:#fff;font-size:14px;outline:none}
  .search-box input::placeholder{color:var(--muted)}

  .tabs{display:flex;gap:4px;padding:0 12px 8px;overflow-x:auto}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:7px 14px;border-radius:16px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;transition:.2s}
  .tab:hover{background:var(--hover);color:#fff}.tab.active{background:var(--accent);color:#fff}

  .chat-list{flex:1;overflow-y:auto;padding:0 8px}
  .chat-item{display:flex;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.2s;margin-bottom:2px;position:relative}
  .chat-item:hover{background:var(--hover)}.chat-item.active{background:var(--accent)}
  .chat-item.active .ci-name,.chat-item.active .ci-last,.chat-item.active .ci-time{color:#fff}
  .avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:20px;color:#fff;flex-shrink:0;position:relative}
  .avatar .dot{position:absolute;bottom:2px;right:2px;width:14px;height:14px;border-radius:50%;background:var(--green);border:2px solid var(--sidebar)}
  .chat-item.active .avatar .dot{border-color:var(--accent)}
  .type-badge{position:absolute;bottom:-2px;right:-2px;background:var(--sidebar);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;border:2px solid var(--sidebar)}
  .chat-item.active .type-badge{border-color:var(--accent)}
  .ci-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .ci-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:6px}
  .ci-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
  .ci-time{font-size:12px;color:var(--muted);flex-shrink:0}
  .ci-bottom{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .ci-last{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .role-badge{display:inline-flex;align-items:center;gap:2px;font-size:9px;font-weight:800;text-transform:uppercase;padding:2px 5px;border-radius:5px;letter-spacing:.3px;flex-shrink:0;line-height:1}
  .role-dev{background:linear-gradient(135deg,#a06bff,#6c5ce7);color:#fff}
  .role-admin{background:linear-gradient(135deg,#ff3b30,#ff6b6b);color:#fff}
  .role-creator{background:linear-gradient(135deg,#f5b642,#ff9500);color:#000}
  .role-premium{background:linear-gradient(135deg,#f5b642,#f5d042);color:#000}
  .role-verified{background:var(--accent);color:#fff;width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;padding:0;font-weight:700}

  /* CHAT AREA */
  .chat-area{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);position:relative}
  .chat-header{height:60px;background:var(--header);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid var(--border);z-index:10}
  .back-btn{display:none;background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:8px}
  .chat-header .avatar{width:42px;height:42px;font-size:16px}
  .ch-info{flex:1;min-width:0}
  .ch-name{font-size:16px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .ch-status{font-size:13px;color:var(--accent);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .messages{flex:1;overflow-y:auto;padding:20px 40px;display:flex;flex-direction:column;gap:4px}
  .msg{max-width:60%;padding:8px 12px;border-radius:12px;font-size:14.5px;line-height:1.4;position:relative;word-wrap:break-word;animation:fadeIn .2s ease;box-shadow:0 1px 2px rgba(0,0,0,.2);cursor:pointer;transition:.15s}
  .msg:hover{filter:brightness(1.1)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .msg.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:2px}
  .msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:2px}
  .msg .sender{font-size:13px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px}
  .msg .sender .name{color:var(--accent)}
  .msg .meta{font-size:11px;color:var(--muted);float:right;margin:4px 0 0 8px;display:inline-flex;align-items:center;gap:3px}
  .msg.out .meta{color:#a0c0e0}.tick{color:var(--green);font-size:13px;letter-spacing:-2px}

  .msg .quoted{margin-bottom:6px;padding:5px 8px;border-left:3px solid var(--accent);background:rgba(82,136,193,.15);border-radius:5px;font-size:13px;cursor:pointer}
  .msg.out .quoted{background:rgba(255,255,255,.1);border-left-color:#fff}
  .quoted .q-name{font-weight:700;color:var(--accent);margin-bottom:2px}
  .msg.out .quoted .q-name{color:#fff}
  .quoted .q-text{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
  .msg.out .quoted .q-text{color:rgba(255,255,255,.75)}

  .msg.sticker{background:transparent!important;box-shadow:none;padding:0;font-size:72px;line-height:1;max-width:120px}
  .msg.sticker:hover{filter:none;transform:scale(1.08)}

  .msg-reactions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;position:relative;z-index:1}
  .reaction{display:inline-flex;align-items:center;gap:3px;background:rgba(82,136,193,.3);padding:2px 7px;border-radius:10px;font-size:12px;cursor:pointer;transition:.15s;user-select:none}
  .msg.out .reaction{background:rgba(255,255,255,.2)}
  .reaction:hover{transform:scale(1.1);background:rgba(82,136,193,.5)}
  .reaction.mine{background:var(--accent);color:#fff}
  .reaction .r-count{font-weight:600}

  .typing{align-self:flex-start;padding:12px 16px;display:flex;gap:4px;background:var(--bubble-in);border-radius:12px;border-bottom-left-radius:2px}
  .typing i{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:bounce 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  /* ACTION MENU */
  .action-menu{position:fixed;background:var(--sidebar);border:1px solid var(--border);border-radius:14px;padding:8px;display:none;z-index:150;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:fadeIn .15s ease}
  .action-menu.open{display:block}
  .action-reactions{display:flex;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:6px}
  .action-emoji{width:38px;height:38px;border-radius:50%;border:none;background:transparent;font-size:22px;cursor:pointer;transition:.15s;display:grid;place-items:center}
  .action-emoji:hover{background:var(--hover);transform:scale(1.2)}
  .action-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:14px;transition:.15s;white-space:nowrap}
  .action-item:hover{background:var(--hover)}
  .action-item .ico{font-size:16px}

  /* REPLY PREVIEW */
  .reply-preview{background:var(--header);padding:10px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;animation:slideDown .2s ease}
  @keyframes slideDown{from{max-height:0;padding-top:0;padding-bottom:0;opacity:0}to{max-height:100px;opacity:1}}
  .reply-preview .rp-bar{width:3px;height:36px;background:var(--accent);border-radius:2px}
  .reply-preview .rp-body{flex:1;min-width:0}
  .reply-preview .rp-name{font-size:12px;font-weight:700;color:var(--accent)}
  .reply-preview .rp-text{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reply-preview .rp-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px}

  /* INPUT */
  .input-area{padding:10px 16px;background:var(--header);display:flex;align-items:flex-end;gap:10px}
  .input-area textarea{flex:1;background:transparent;border:none;color:#fff;font-size:15px;resize:none;max-height:120px;min-height:24px;outline:none;padding:8px 0;font-family:inherit;line-height:1.4}
  .input-area textarea::placeholder{color:var(--muted)}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:6px;transition:.2s;border-radius:50%}
  .icon-btn:hover{color:#fff}.send-btn{background:none;border:none;color:var(--accent);cursor:pointer;padding:6px;display:grid;place-items:center;transition:.2s}
  .send-btn:hover{color:#fff;transform:scale(1.1)}

  /* STICKER PANEL */
  .sticker-panel{background:var(--sidebar);border-top:1px solid var(--border);padding:12px;display:none;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;max-height:240px;overflow-y:auto}
  .sticker-panel.open{display:grid;animation:slideDown .2s ease}
  .sticker-item{aspect-ratio:1;background:transparent;border:none;font-size:38px;cursor:pointer;border-radius:10px;transition:.15s}
  .sticker-item:hover{background:var(--hover);transform:scale(1.15)}

  /* MODAL */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px);padding:16px}
  .modal.open{display:flex;animation:fadeIn .2s ease}
  .modal-content{background:var(--sidebar);width:100%;max-width:420px;max-height:92vh;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .modal-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);font-size:17px;font-weight:700}
  .modal-header .close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
  .modal-body{padding:20px;overflow-y:auto}

  .form-group{margin-bottom:14px}
  .form-label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
  .form-input{width:100%;padding:12px 14px;background:var(--hover);border:1px solid transparent;border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit;transition:.2s}
  .form-input:focus{border-color:var(--accent);background:#2b3a4a}
  .type-selector{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .type-option{padding:12px 8px;background:var(--hover);border:2px solid transparent;border-radius:12px;cursor:pointer;text-align:center;transition:.2s;font-size:12px;font-weight:600}
  .type-option .ico{font-size:22px;display:block;margin-bottom:4px}
  .type-option:hover{background:#2b3a4a}
  .type-option.active{border-color:var(--accent);background:rgba(82,136,193,.15)}

  .emoji-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:6px}
  .emoji-choice{aspect-ratio:1;background:var(--hover);border:none;border-radius:10px;font-size:22px;cursor:pointer;transition:.15s}
  .emoji-choice:hover{background:#2b3a4a;transform:scale(1.1)}
  .emoji-choice.active{background:var(--accent)}

  .primary-btn{width:100%;padding:14px;background:linear-gradient(135deg,#6c5ce7,#00d4ff);border:none;color:#fff;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer;transition:.2s;margin-top:8px}
  .primary-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(108,92,231,.4)}
  .primary-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

  /* PROFILE */
  .profile-banner{height:130px;background:linear-gradient(135deg,#6c5ce7,#00d4ff,#ff6b9d);background-size:200% 200%;animation:gradShift 8s ease infinite;position:relative}
  @keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .profile-banner .close{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.4);border:none;color:#fff;font-size:16px;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
  .profile-avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:700;color:#fff;margin-top:-48px;border:4px solid var(--sidebar);position:relative;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .profile-avatar .status-dot{position:absolute;bottom:4px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--green);border:3px solid var(--sidebar)}
  .profile-name{font-size:22px;font-weight:700;margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .profile-username{font-size:14px;color:var(--accent);margin-top:2px}
  .profile-bio{font-size:14px;color:var(--muted);margin-top:8px;line-height:1.4}
  .stats-row{display:flex;gap:8px;margin-top:16px}
  .stat-card{flex:1;background:var(--hover);padding:10px;border-radius:12px;text-align:center}
  .stat-value{font-size:16px;font-weight:700}.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
  .stars-card{margin-top:12px;background:linear-gradient(135deg,rgba(245,182,66,.15),rgba(245,182,66,.05));border:1px solid rgba(245,182,66,.3);padding:14px 16px;border-radius:14px;display:flex;align-items:center;justify-content:space-between}
  .stars-left{display:flex;align-items:center;gap:10px}
  .stars-ico-big{font-size:28px;color:var(--gold)}
  .stars-info .label{font-size:12px;color:var(--muted)}.stars-info .value{font-size:18px;font-weight:700;color:var(--gold)}
  .buy-btn{background:var(--gold);color:#000;border:none;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;transition:.2s}
  .buy-btn:hover{transform:scale(1.05)}
  .section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 10px}
  .info-item{background:var(--hover);padding:12px 14px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;cursor:pointer;transition:.2s;gap:10px}
  .info-item:hover{background:#2b3a4a}
  .info-label{font-size:13px;color:var(--muted);flex-shrink:0}
  .info-value{font-size:14px;font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .role-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .role-option{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;border:2px solid transparent;cursor:pointer;transition:.2s;background:var(--hover);color:var(--muted)}
  .role-option:hover{background:#2b3a4a}.role-option.active{border-color:#fff}
  .role-option[data-role="dev"]{background:linear-gradient(135deg,#a06bff,#6c5ce7);color:#fff}
  .role-option[data-role="admin"]{background:linear-gradient(135deg,#ff3b30,#ff6b6b);color:#fff}
  .role-option[data-role="creator"]{background:linear-gradient(135deg,#f5b642,#ff9500);color:#000}
  .role-option[data-role="premium"]{background:linear-gradient(135deg,#f5b642,#f5d042);color:#000}
  .logout-btn{margin-top:16px;width:100%;padding:13px;background:rgba(255,59,48,.1);color:var(--red);border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
  .logout-btn:hover{background:rgba(255,59,48,.2)}

  /* NFT */
  .nft-view{padding:16px}
  .nft-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
  .nft-card{background:var(--hover);border-radius:14px;overflow:hidden;cursor:pointer;transition:.2s;position:relative}
  .nft-card:hover{transform:translateY(-3px);background:#2b3a4a}
  .nft-img{aspect-ratio:1;display:grid;place-items:center;font-size:48px;position:relative}
  .nft-card .nft-rarity{position:absolute;top:8px;right:8px;font-size:10px;padding:3px 7px;border-radius:8px;font-weight:700;text-transform:uppercase}
  .rarity-common{background:rgba(108,120,131,.8);color:#fff}
  .rarity-rare{background:rgba(82,136,193,.9);color:#fff}
  .rarity-epic{background:rgba(160,107,255,.9);color:#fff}
  .rarity-legendary{background:rgba(245,182,66,.95);color:#000}
  .nft-info{padding:8px 10px 10px}
  .nft-name{font-size:13px;font-weight:600;margin-bottom:2px}
  .nft-price{font-size:12px;color:var(--gold);display:flex;align-items:center;gap:3px}

  .channel-info-bar{background:var(--header);padding:10px 40px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
  .subscribe-btn{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
  .subscribe-btn:hover{transform:scale(1.04)}.subscribe-btn.subscribed{background:transparent;color:var(--muted);border:1px solid var(--muted)}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:40px 20px;gap:12px}
  .empty-state .ico{font-size:56px;opacity:.4}.empty-state .txt{font-size:14px}

  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--accent);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .3s ease;z-index:200;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}

  @media (max-width:820px){
    .sidebar{width:100%;border:none}
    .chat-area{position:absolute;inset:0;z-index:20;transform:translateX(100%);transition:transform .3s ease}
    .app.show-chat .chat-area{transform:translateX(0)}
    .back-btn{display:block}.messages{padding:16px 12px}.msg{max-width:85%}
    .input-area{padding:8px 10px}.channel-info-bar{padding:10px 16px}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-header">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="side-title">Feroll.IQ</div>
      <div class="star-balance" id="starBalance"><span class="star-ico">⭐</span><span id="starCount">0</span></div>
      <button class="add-btn" id="addBtn" title="Создать">+</button>
    </div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Поиск"></div>
    <div class="tabs">
      <button class="tab active" data-filter="all">Все</button>
      <button class="tab" data-filter="chat">Чаты</button>
      <button class="tab" data-filter="channel">Каналы</button>
      <button class="tab" data-filter="group">Группы</button>
      <button class="tab" data-filter="nft">NFT</button>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="chat-area" id="chatArea">
    <div class="chat-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="avatar" id="headAvatar"></div>
      <div class="ch-info">
        <div class="ch-name" id="headName"></div>

<script>
/* ============ ДАННЫЕ ============ */
const DEFAULT_PROFILE = { name:'Пользователь', username:'feroll_user', bio:'Привет! Я использую Feroll.IQ 🚀', avatar:'🚀', avatarBg:'linear-gradient(135deg,#6c5ce7,#00d4ff)', stars:250, role:'dev', verified:true };

const DEFAULTS = [

    ]},
  { id:'alina', type:'chat', name:'Алина Соколова', username:'alina_s', status:'в сети', online:true, c1:'#ff6b9d', c2:'#ff9f68', avatar:'А', role:'premium',
    messages:[
      { t:'Привет! Как дела?', out:false, ts:Date.now()-7200000, reactions:[{e:'❤️',c:1,mine:true}] },
      { t:'Отлично, а у тебя?', out:true, ts:Date.now()-7100000 },
      { t:'Тоже всё хорошо 😊', out:false, ts:Date.now()-7000000, reactions:[{e:'🔥',c:2,mine:false},{e:'👍',c:1,mine:true}] }
    ]},
  { id:'maxim', type:'chat', name:'Максим Ветров', username:'maxim_v', status:'был(а) недавно', online:false, c1:'#00c2a8', c2:'#4cd964', avatar:'М',
    messages:[ { t:'Скинь файлы по проекту', out:false, ts:Date.now()-5400000 } ]}
];

const NFTS = [
  { id:'nft1', name:'Золотая Звезда', ico:'⭐', rarity:'legendary', price:500, bg:'linear-gradient(135deg,#f5b642,#ff9500)' },
  { id:'nft2', name:'Космический Кот', ico:'🐱‍🚀', rarity:'epic', price:300, bg:'linear-gradient(135deg,#a06bff,#6c5ce7)' },
  { id:'nft3', name:'Алмазный Кубок', ico:'🏆', rarity:'legendary', price:450, bg:'linear-gradient(135deg,#00d4ff,#6c5ce7)' },
  { id:'nft4', name:'Ракета Feroll', ico:'🚀', rarity:'rare', price:180, bg:'linear-gradient(135deg,#ff6b9d,#ff9f68)' },
  { id:'nft5', name:'Огненный Шар', ico:'🔥', rarity:'rare', price:150, bg:'linear-gradient(135deg,#ff3b30,#f5b642)' },
  { id:'nft6', name:'Кристалл', ico:'💎', rarity:'epic', price:280, bg:'linear-gradient(135deg,#4dcd5e,#00c2a8)' },
  { id:'nft7', name:'Подарок', ico:'🎁', rarity:'common', price:50, bg:'linear-gradient(135deg,#6c7883,#5288c1)' },
  { id:'nft8', name:'Корона', ico:'👑', rarity:'legendary', price:600, bg:'linear-gradient(135deg,#f5b642,#ff3b30)' }
];

const RARITY_LABEL = { common:'Обычный', rare:'Редкий', epic:'Эпический', legendary:'Легендарный' };
const ROLE_META = {
  dev:{ label:'Разработчик', ico:'🛠', cls:'role-dev' },
  admin:{ label:'Админ', ico:'🛡', cls:'role-admin' },
  creator:{ label:'Владелец', ico:'👑', cls:'role-creator' },
  premium:{ label:'Премиум', ico:'⭐', cls:'role-premium' }
};
const REPLIES = ['Понял тебя 👌','Согласен!','Хм, интересно 🤔','Давай обсудим','Хорошо, сделаю','Отличная идея! 🔥','Ок, договорились','Ага, всё верно'];
const REACTION_EMOJIS = ['❤️','👍','🔥','😂','😮','😢'];
const STICKERS = ['😀','😂','😍','🥳','😎','🤔','😴','🤯','🥺','😈','🤖','👻','🐱','🐶','🦊','🐼','🚀','⭐','💎','🎁','🔥','💯','✨','🎉','👑','🎮','⚽','🍕','🍔','☕','🎸','🎨'];
const CREATE_EMOJIS = ['💬','📢','👥','🚀','⭐','🔥','💎','🎁','👑','🎮','🎨','💡','🌟','⚡','🌈','🦊','🐱','🐼','🦁','🐧','🎯','🏆','🌍','🛸'];

/* ============ СОСТОЯНИЕ ============ */
const STORE = 'feroll_iq_v4';
let state = loadState();
let activeId = state.activeId || 'alina';
let filter = 'all';
let searchFilter = '';
let replyTo = null;
let actionTarget = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) { const p = JSON.parse(raw); if (p && p.chats && p.profile) return p; }
  } catch(e){}
  return { chats: DEFAULTS, profile: {...DEFAULT_PROFILE}, ownedNfts:['nft7'], activeId:'alina' };
}
function saveState() { state.activeId = activeId; try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e){} }

/* ============ ХЕЛПЕРЫ ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getChat = id => state.chats.find(c => c.id === id);
const grad = c => `linear-gradient(135deg, ${c.c1}, ${c.c2})`;
const timeOf = ts => { const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); };
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function closeModal(id){ $(id).classList.remove('open'); }
function roleBadgeHTML(role){ if(!role||!ROLE_META[role]) return ''; const m=ROLE_META[role]; return `<span class="role-badge ${m.cls}">${m.ico}${m.label}</span>`; }
function verifiedBadgeHTML(v){ return v ? `<span class="role-badge role-verified">✓</span>` : ''; }
const isSticker = t => t && t.startsWith('sticker:');
const stickerEmoji = t => t.replace('sticker:','');

/* ============ РЕНДЕР СПИСКА ============ */
function renderList() {
  const list = $('chatList');
  if (filter === 'nft') { renderNftGrid(list); return; }
  let items = state.chats.filter(c => {
    if (filter !== 'all' && c.type !== filter) return false;
    if (searchFilter) {
      const q = searchFilter.toLowerCase();
      if (!c.name.toLowerCase().includes(q) && !(c.username||'').toLowerCase().includes(q)) return false;
    }
    return true;
  });
  list.innerHTML = '';
  if (!items.length) { list.innerHTML = '<div class="empty-state"><div class="ico">🔍</div><div class="txt">Ничего не найдено</div></div>'; return; }
  items.forEach(c => {
    const last = c.messages[c.messages.length-1];
    const typeIco = c.type === 'channel' ? '📢' : c.type === 'group' ? '👥' : null;
    const preview = last ? (isSticker(last.t) ? '🎨 Стикер' : esc(last.t)) : 'Нет сообщений';
    const el = document.createElement('div');
    el.className = 'chat-item' + (c.id === activeId ? ' active' : '');
    el.innerHTML = `
      <div class="avatar" style="background:${grad(c)}">
        ${c.avatar && c.avatar.length <= 3 ? c.avatar : (c.avatar||c.name[0]).toUpperCase()}
        ${c.online && c.type==='chat' ? '<span class="dot"></span>' : ''}
        ${typeIco ? `<span class="type-badge">${typeIco}</span>` : ''}
      </div>
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${esc(c.name)} ${roleBadgeHTML(c.role)} ${verifiedBadgeHTML(c.verified)}</div>
          <div class="ci-time">${last ? timeOf(last.ts) : ''}</div>
        </div>
        <div class="ci-bottom">
          <div class="ci-last">${last ? (last.out ? 'Вы: ' : (last.sender ? esc(last.sender)+': ' : '')) + preview : 'Нет сообщений'}</div>
        </div>
      </div>`;
    el.onclick = () => openChat(c.id);
    list.appendChild(el);
  });
}

function renderNftGrid(container) {
  container.innerHTML = '';
  const view = document.createElement('div'); view.className = 'nft-view';
  view.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;"><div style="font-size:15px;font-weight:700;">Коллекция NFT</div><div style="font-size:12px;color:var(--muted);">Куплено: ${state.ownedNfts.length}/${NFTS.length}</div></div>`;
  const grid = document.createElement('div'); grid.className = 'nft-grid';
  NFTS.forEach(n => {
    const owned = state.ownedNfts.includes(n.id);
    const card = document.createElement('div'); card.className = 'nft-card';
    card.innerHTML = `
      <div class="nft-img" style="background:${n.bg};">${n.ico}<span class="nft-rarity rarity-${n.rarity}">${RARITY_LABEL[n.rarity]}</span>${owned?'<span style="position:absolute;bottom:8px;left:8px;background:rgba(77,205,94,.95);color:#fff;font-size:10px;padding:3px 7px;border-radius:8px;font-weight:700;">✓ ЕСТЬ</span>':''}</div>
      <div class="nft-info"><div class="nft-name">${n.name}</div><div class="nft-price">⭐ ${n.price}</div></div>`;
    card.onclick = () => openNft(n.id);
    grid.appendChild(card);
  });
  view.appendChild(grid); container.appendChild(view);
}

/* ============ РЕНДЕР ЧАТА ============ */
function renderChat() {
  const c = getChat(activeId); if (!c) return;
  const av = $('headAvatar'); av.style.background = grad(c);
  av.textContent = c.avatar && c.avatar.length <= 3 ? c.avatar : (c.avatar||c.name[0]).toUpperCase();
  $('headName').innerHTML = esc(c.name) + ' ' + roleBadgeHTML(c.role) + verifiedBadgeHTML(c.verified);

  let statusText = '';
  if (c.type === 'channel') statusText = (c.subscribers||0).toLocaleString('ru-RU') + ' подписчиков';
  else if (c.type === 'group') statusText = (c.members||0).toLocaleString('ru-RU') + ' участников';
  else statusText = c.online ? 'в сети' : (c.status || 'был(а) недавно');
  $('headStatus').textContent = statusText;

  const bar = $('channelBar');
  if (c.type === 'channel') {
    bar.style.display = 'flex';
    $('subscriberCount').textContent = (c.subscribers||0).toLocaleString('ru-RU') + ' подписчиков';
    const btn = $('subscribeBtn');
    btn.textContent = c.subscribed ? 'Отписаться' : 'Подписаться';
    btn.classList.toggle('subscribed', !!c.subscribed);
  } else bar.style.display = 'none';

  $('inputArea').style.display = (c.type === 'channel' && !c.isOwn) ? 'none' : 'flex';

  const box = $('messages'); box.innerHTML = '';
  c.messages.forEach((m, idx) => box.appendChild(bubble(m, idx)));

  if (c.typing) { const t = document.createElement('div'); t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>'; box.appendChild(t); }
  box.scrollTop = box.scrollHeight;
}

function bubble(m, idx) {
  const d = document.createElement('div');
  const sticker = isSticker(m.t);
  d.className = 'msg ' + (m.out ? 'out' : 'in') + (sticker ? ' sticker' : '');
  d.dataset.idx = idx;

  let html = '';
  if (!m.out && m.sender && !sticker) html += `<div class="sender"><span class="name">${esc(m.sender)}</span>${roleBadgeHTML(m.senderRole)}</div>`;

  if (m.replyTo && !sticker) {
    html += `<div class="quoted"><div class="q-name">${esc(m.replyTo.sender||'Сообщение')}</div><div class="q-text">${esc(m.replyTo.text)}</div></div>`;
  }

  if (sticker) html += stickerEmoji(m.t);
  else html += esc(m.t) + `<span class="meta">${timeOf(m.ts)}${m.out?' <span class="tick">✓✓</span>':''}</span>`;

  if (m.reactions && m.reactions.length) {
    html += `<div class="msg-reactions">`;
    m.reactions.forEach(r => {
      html += `<span class="reaction ${r.mine?'mine':''}" data-emoji="${r.e}">${r.e} <span class="r-count">${r.c}</span></span>`;
    });
    html += `</div>`;
  }

  d.innerHTML = html;

  // Реакции — клик по существующей
  d.querySelectorAll('.reaction').forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); toggleReaction(m, el.dataset.emoji, idx); };
  });

  // Клик по сообщению — меню действий
  d.onclick = (e) => { e.stopPropagation(); openActionMenu(e, m, idx, d); };
  d.oncontextmenu = (e) => { e.preventDefault(); openActionMenu(e, m, idx, d); };

  return d;
}

/* ============ РЕАКЦИИ ============ */
function toggleReaction(m, emoji, idx) {
  if (!m.reactions) m.reactions = [];
  const existing = m.reactions.find(r => r.e === emoji);
  if (existing) {
    if (existing.mine) {
      existing.c--;
      existing.mine = false;
      if (existing.c <= 0) m.reactions = m.reactions.filter(r => r.e !== emoji);
    } else {
      existing.c++;
      existing.mine = true;
    }
  } else {
    m.reactions.push({ e:emoji, c:1, mine:true });
  }
  saveState(); renderChat();
}

/* ============ ACTION MENU ============ */
function openActionMenu(e, m, idx, msgEl) {
  actionTarget = { m, idx };
  const menu = $('actionMenu');

  // Реакции
  const rBox = $('actionReactions');
  rBox.innerHTML = '';
  REACTION_EMOJIS.forEach(em => {
    const b = document.createElement('button');
    b.className = 'action-emoji'; b.textContent = em;
    b.onclick = (ev) => { ev.stopPropagation(); toggleReaction(m, em, idx); menu.classList.remove('open'); };
    rBox.appendChild(b);
  });

  // Позиционирование
  const rect = msgEl.getBoundingClientRect();
  menu.classList.add('open');
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let x = rect.left + rect.width/2 - mw/2;
  let y = rect.top - mh - 8;
  if (y < 8) y = rect.bottom + 8;
  if (x < 8) x = 8;
  if (x + mw > window.innerWidth - 8) x = window.innerWidth - mw - 8;
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
}

document.addEventListener('click', () => $('actionMenu').classList.remove('open'));

$('replyAction').onclick = () => {
  if (!actionTarget) return;
  const { m } = actionTarget;
  replyTo = { text: isSticker(m.t) ? '🎨 Стикер' : m.t, sender: m.out ? state.profile.name : (m.sender || getChat(activeId).name) };
  $('replyPreview').style.display = 'flex';
  $('rpName').textContent = replyTo.sender;
  $('rpText').textContent = replyTo.text;
  $('actionMenu').classList.remove('open');
  $('input').focus();
};

$('copyAction').onclick = () => {
  if (!actionTarget) return;
  const txt = actionTarget.m.t;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Скопировано'));
  else toast('Скопировано');
  $('actionMenu').classList.remove('open');
};

$('rpClose').onclick = () => { replyTo = null; $('replyPreview').style.display = 'none'; };

/* ============ ДЕЙСТВИЯ ============ */
function openChat(id) { activeId = id; state.activeId = id; replyTo = null; $('replyPreview').style.display = 'none'; saveState(); renderList(); renderChat(); $('app').classList.add('show-chat'); }

function sendText(text, isStickerMsg) {
  const c = getChat(activeId); if (!c || c.type === 'channel') return;
  const msg = { t:text, out:true, ts:Date.now(), sender:state.profile.name, senderRole:state.profile.role };
  if (replyTo) { msg.replyTo = { ...replyTo }; replyTo = null; $('replyPreview').style.display = 'none'; }
  c.messages.push(msg);
  saveState(); renderChat(); renderList();
  // имитация ответа
  if (c.type === 'chat' || c.type === 'group') {
    setTimeout(() => {
      const cc = getChat(c.id); if (!cc) return;
      cc.typing = true; if (activeId === cc.id) renderChat();
      setTimeout(() => {
        cc.typing = false;
        const reply = REPLIES[Math.floor(Math.random()*REPLIES.length)];
        let sender = 'Друг', senderRole = null;
        if (cc.type === 'chat') { sender = cc.name.split(' ')[0]; senderRole = cc.role; }
        else { const arr = [{n:'Алина',r:'premium'},{n:'Максим',r:'dev'},{n:'Ирина',r:'admin'}]; const p = arr[Math.floor(Math.random()*arr.length)]; sender = p.n; senderRole = p.r; }
        cc.messages.push({ t:reply, out:false, ts:Date.now(), sender, senderRole });
        if (activeId === cc.id) renderChat();
        saveState(); renderList();
      }, 1400);
    }, 500);
  }
}

function send() {
  const inp = $('input'); const text = inp.value.trim(); if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  sendText(text, false);
}

function sendStar() {
  const c = getChat(activeId); if (!c) return;
  if (state.profile.stars < 1) { toast('Недостаточно звёзд ⭐'); return; }
  state.profile.stars--;
  c.messages.push({ t:'⭐ Отправлена звезда', out:true, ts:Date.now(), sender:state.profile.name, senderRole:state.profile.role });
  saveState(); renderChat(); renderList(); updateStarUI();
  toast('Звезда отправлена!');
}

/* ============ STICKER PANEL ============ */
function buildStickerPanel() {
  const p = $('stickerPanel'); p.innerHTML = '';
  STICKERS.forEach(s => {
    const b = document.createElement('button'); b.className = 'sticker-item'; b.textContent = s;
    b.onclick = () => { sendText('sticker:' + s, true); p.classList.remove('open'); };
    p.appendChild(b);
  });
}

/* ============ СОЗДАНИЕ ============ */
let createType = 'channel', createEmoji = '💬';

function buildEmojiPicker() {
  const p = $('emojiPicker'); p.innerHTML = '';
  CREATE_EMOJIS.forEach(e => {
    const b = document.createElement('button'); b.className = 'emoji-choice' + (e===createEmoji?' active':''); b.textContent = e;
    b.onclick = () => { createEmoji = e; document.querySelectorAll('.emoji-choice').forEach(x => x.classList.remove('active')); b.classList.add('active'); };
    p.appendChild(b);
  });
}

document.querySelectorAll('.type-option').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.type-option').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    createType = t.dataset.type;
  };
});

function openCreate() {
  $('createName').value = ''; $('createUsername').value = ''; createEmoji = '💬';
  document.querySelectorAll('.type-option').forEach(x => x.classList.toggle('active', x.dataset.type === 'channel'));
  createType = 'channel';
  buildEmojiPicker();
  $('createSubmit').disabled = true;
  $('createModal').classList.add('open');
}
function closeCreate() { $('createModal').classList.remove('open'); }

$('createName').addEventListener('input', checkCreate);
$('createUsername').addEventListener('input', checkCreate);
function checkCreate() {
  const n = $('createName').value.trim(); const u = $('createUsername').value.trim();
  $('createSubmit').disabled = !(n && u);
}

$('createSubmit').onclick = () => {
  const name = $('createName').value.trim();
  let username = $('createUsername').value.trim().replace(/[^a-zA-Z0-9_]/g, '');
  if (!name || !username) return;
  if (getChat('user_' + username)) { toast('Такой юзернейм уже занят'); return; }

  const colors = [
    { c1:'#6c5ce7', c2:'#00d4ff' }, { c1:'#ff6b9d', c2:'#ff9f68' },
    { c1:'#00c2a8', c2:'#4cd964' }, { c1:'#a06bff', c2:'#6c5ce7' },
    { c1:'#f5b642', c2:'#ff6b9d' }, { c1:'#ff3b30', c2:'#f5b642' }
  ];
  const col = colors[Math.floor(Math.random()*colors.length)];

  const newChat = {
    id: 'user_' + username + '_' + Date.now(),
    type: createType, name, username, avatar: createEmoji,
    c1: col.c1, c2: col.c2, isOwn: true, online: true,
    role: 'creator', verified: false,
    messages: [{ t: createType === 'channel' ? '📢 Канал создан! Начните публиковать.' : '💬 Чат создан! Пригласите друзей.', out:false, ts:Date.now(), sender:name, senderRole:'creator' }]
  };
  if (createType === 'channel') { newChat.subscribers = 1; newChat.subscribed = true; }
  if (createType === 'group') { newChat.members = 1; }

  state.chats.unshift(newChat);
  saveState(); closeCreate();
  openChat(newChat.id);
  toast('Создано: ' + name);
};

/* ============ ПРОФИЛЬ ============ */
function openProfile() {
  const p = state.profile;
  $('profileAvatar').innerHTML = (p.avatar && p.avatar.length<=3 ? p.avatar : p.avatar[0].toUpperCase()) + '<div class="status-dot"></div>';
  $('profileAvatar').style.background = p.avatarBg;
  $('profileName').innerHTML = esc(p.name) + ' ' + roleBadgeHTML(p.role) + verifiedBadgeHTML(p.verified);
  $('profileUsername').textContent = '@' + p.username;
  $('profileBio').textContent = p.bio;
  $('usernameValue').textContent = '@' + p.username;
  $('nameValue').textContent = p.name;
  $('avatarValue').textContent = p.avatar;
  $('verifiedValue').textContent = p.verified ? 'Вкл ✓' : 'Выкл';
  $('starCountModal').textContent = p.stars;
  $('statChats').textContent = state.chats.filter(c => c.type === 'chat').length;
  $('statSubs').textContent = state.chats.filter(c => c.type === 'channel' && c.subscribed).length;
  $('statNft').textContent = state.ownedNfts.length;
  document.querySelectorAll('.role-option').forEach(el => el.classList.toggle('active', el.dataset.role === (p.role || 'none')));
  $('profileModal').classList.add('open');
}
function editUsername(){ const v=prompt('Юзернейм (без @):', state.profile.username); if(v&&v.trim()){ state.profile.username=v.trim().replace(/[^a-zA-Z0-9_]/g,''); saveState(); openProfile(); toast('Обновлено'); }}
function editName(){ const v=prompt('Имя:', state.profile.name); if(v&&v.trim()){ state.profile.name=v.trim(); saveState(); openProfile(); toast('Обновлено'); }}
function editAvatar(){ const v=prompt('Эмодзи:', state.profile.avatar); if(v&&v.trim()){ state.profile.avatar=v.trim(); saveState(); openProfile(); toast('Обновлено'); }}
function toggleVerified(){ state.profile.verified = !state.profile.verified; saveState(); openProfile(); toast(state.profile.verified?'✓ Верификация вкл':'Верификация выкл'); }
function updateStarUI(){ $('starCount').textContent = state.profile.stars; $('starCountModal').textContent = state.profile.stars; }

document.querySelectorAll('.role-option').forEach(el => {
  el.onclick = () => {
    const r = el.dataset.role;
    state.profile.role = r === 'none' ? null : r;
    saveState(); openProfile();
    toast('Роль: ' + (r==='none'?'Обычный':ROLE_META[r].label));
  };
});

/* ============ NFT ============ */
let currentNft = null;
function openNft(id) {
  const n = NFTS.find(x => x.id === id); if (!n) return;
  currentNft = n;
  const owned = state.ownedNfts.includes(n.id);
  $('nftModalIco').textContent = n.ico;
  $('nftModalName').textContent = n.name;
  $('nftModalRarity').textContent = RARITY_LABEL[n.rarity];
  $('nftModalRarity').style.color = n.rarity==='legendary'?'var(--gold)':n.rarity==='epic'?'#a06bff':'var(--accent)';
  $('nftModalPrice').textContent = n.price;
  $('nftModalDesc').textContent = owned ? '✓ Уже в вашей коллекции' : 'Коллекционный предмет Feroll.IQ';
  $('buyNftBtn').textContent = owned ? 'Уже есть' : 'Купить';
  $('buyNftBtn').disabled = owned;
  $('buyNftBtn').style.opacity = owned ? '0.5' : '1';
  $('nftModal').classList.add('open');
}
$('buyNftBtn').onclick = () => {
  if (!currentNft || state.ownedNfts.includes(currentNft.id)) return;
  if (state.profile.stars < currentNft.price) { toast('Недостаточно звёзд ⭐'); return; }
  state.profile.stars -= currentNft.price;
  state.ownedNfts.push(currentNft.id);
  saveState(); updateStarUI();
  toast(`Куплено: ${currentNft.name}`);
  closeModal('nftModal');
  if (filter === 'nft') renderList();
};

/* ============ ПОДПИСКА ============ */
$('subscribeBtn').onclick = () => {
  const c = getChat(activeId); if (!c || c.type !== 'channel') return;
  c.subscribed = !c.subscribed;
  c.subscribers = (c.subscribers || 0) + (c.subscribed ? 1 : -1);
  saveState(); renderChat();
  toast(c.subscribed ? 'Вы подписались ✓' : 'Вы отписались');
};

/* ============ СОБЫТИЯ ============ */
$('sendBtn').onclick = send;
$('starBtn').onclick = sendStar;
$('emojiBtn').onclick = () => {
  const inp = $('input');
  const e = ['😀','😂','😊','😍','🔥','❤️','👍','🎉','🚀','⭐','💎','🎁'];
  inp.value += e[Math.floor(Math.random()*e.length)]; inp.focus();
};
$('stickerBtn').onclick = () => $('stickerPanel').classList.toggle('open');
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('input').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px'; });
$('searchInput').addEventListener('input', e => { searchFilter = e.target.value; renderList(); });
$('backBtn').onclick = () => $('app').classList.remove('show-chat');

$('menuBtn').onclick = openProfile;
$('starBalance').onclick = openProfile;
$('addBtn').onclick = openCreate;
$('buyStarsBtn').onclick = () => { state.profile.stars += 100; saveState(); updateStarUI(); toast('+100 ⭐ (демо)'); };

$('createModal').onclick = e => { if (e.target === $('createModal')) closeCreate(); };
$('profileModal').onclick = e => { if (e.target === $('profileModal')) closeModal('profileModal'); };
$('nftModal').onclick = e => { if (e.target === $('nftModal')) closeModal('nftModal'); };

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    filter = t.dataset.filter;
    renderList();
    $('chatArea').style.display = (filter === 'nft') ? 'none' : 'flex';
  };
});

/* ============ СТАРТ ============ */
if (!getChat(activeId)) activeId = state.chats[0].id;
buildStickerPanel();
updateStarUI();
renderList();
renderChat();
</script>
