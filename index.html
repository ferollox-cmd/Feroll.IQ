<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feroll.IQ — Мессенджер</title>
<style>
  :root {
    --tg-bg: #0e1621;
    --tg-sidebar: #17212b;
    --tg-chat-bg: #0e1621;
    --tg-header: #17212b;
    --tg-bubble-in: #182533;
    --tg-bubble-out: #2b5278;
    --tg-accent: #5288c1;
    --tg-text: #ffffff;
    --tg-muted: #6c7883;
    --tg-border: #101921;
    --tg-hover: #202b36;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--tg-bg);
    color: var(--tg-text);
    height: 100vh;
    overflow: hidden;
    display: flex;
  }

  /* ====== БОКОВАЯ ПАНЕЛЬ ====== */
  .sidebar {
    width: 380px;
    background: var(--tg-sidebar);
    border-right: 1px solid var(--tg-border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .side-header {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 60px;
  }
  .menu-btn {
    background: none; border: none; color: var(--tg-muted);
    font-size: 22px; cursor: pointer; padding: 8px;
    border-radius: 50%; transition: 0.2s;
  }
  .menu-btn:hover { background: var(--tg-hover); color: #fff; }
  
  .search-box {
    padding: 0 16px 10px;
  }
  .search-box input {
    width: 100%; padding: 10px 16px; border-radius: 20px;
    border: none; background: #242f3d; color: #fff;
    font-size: 14px; outline: none;
  }
  .search-box input::placeholder { color: var(--tg-muted); }

  .chat-list {
    flex: 1; overflow-y: auto; padding: 0 8px;
  }
  .chat-item {
    display: flex; gap: 12px; padding: 10px 12px;
    border-radius: 10px; cursor: pointer; transition: 0.2s;
    margin-bottom: 2px;
  }
  .chat-item:hover { background: var(--tg-hover); }
  .chat-item.active { background: var(--tg-accent); }
  .chat-item.active .ci-name, .chat-item.active .ci-last, .chat-item.active .ci-time { color: #fff; }

  .avatar {
    width: 54px; height: 54px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 600;
    font-size: 18px; color: #fff; flex-shrink: 0;
    position: relative;
  }
  .avatar .dot {
    position: absolute; bottom: 2px; right: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #4dcd5e; border: 2px solid var(--tg-sidebar);
  }

  .ci-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .ci-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .ci-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-time { font-size: 12px; color: var(--tg-muted); flex-shrink: 0; }
  .ci-bottom { display: flex; justify-content: space-between; align-items: center; }
  .ci-last { font-size: 14px; color: var(--tg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    background: var(--tg-accent); color: #fff; font-size: 12px;
    font-weight: 600; padding: 2px 7px; border-radius: 12px;
  }

  /* ====== ЧАТ ====== */
  .chat-area {
    flex: 1; display: flex; flex-direction: column; background: var(--tg-chat-bg);
    position: relative;
  }
  
  .chat-header {
    height: 60px; background: var(--tg-header);
    display: flex; align-items: center; padding: 0 16px;
    gap: 12px; border-bottom: 1px solid var(--tg-border);
    z-index: 10;
  }
  .back-btn {
    display: none; background: none; border: none;
    color: var(--tg-muted); font-size: 24px; cursor: pointer;
    padding: 8px; margin-right: 4px;
  }
  .chat-header .avatar { width: 42px; height: 42px; font-size: 15px; }
  .ch-info { flex: 1; }
  .ch-name { font-size: 16px; font-weight: 600; }
  .ch-status { font-size: 13px; color: var(--tg-accent); margin-top: 2px; }

  .messages {
    flex: 1; overflow-y: auto; padding: 20px 40px;
    display: flex; flex-direction: column; gap: 2px;
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><path d="M10 10 Q 30 30 50 10 T 90 10" fill="none" stroke="%23182033" stroke-width="0.5"/></svg>') repeat;
  }
  
  .msg {
    max-width: 60%; padding: 8px 12px; border-radius: 12px;
    font-size: 14.5px; line-height: 1.4; position: relative;
    word-wrap: break-word; animation: fadeIn 0.2s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  
  .msg.in {
    align-self: flex-start; background: var(--tg-bubble-in);
    border-bottom-left-radius: 2px;
  }
  .msg.out {
    align-self: flex-end; background: var(--tg-bubble-out);
    border-bottom-right-radius: 2px;
  }
  
  .msg .meta {
    font-size: 11px; color: var(--tg-muted);
    float: right; margin: 4px 0 0 8px;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .msg.out .meta { color: #a0c0e0; }
  .tick { color: #4dcd5e; font-size: 13px; letter-spacing: -2px; }

  .typing { align-self: flex-start; padding: 12px 16px; display: flex; gap: 4px; background: var(--tg-bubble-in); border-radius: 12px; border-bottom-left-radius: 2px; }
  .typing i { width: 6px; height: 6px; background: var(--tg-muted); border-radius: 50%; animation: bounce 1.3s infinite; }
  .typing i:nth-child(2) { animation-delay: 0.2s; }
  .typing i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }

  /* ====== ПОЛЕ ВВОДА ====== */
  .input-area {
    padding: 10px 16px; background: var(--tg-header);
    display: flex; align-items: flex-end; gap: 10px;
  }
  .input-area textarea {
    flex: 1; background: transparent; border: none; color: #fff;
    font-size: 15px; resize: none; max-height: 120px; min-height: 24px;
    outline: none; padding: 8px 0; font-family: inherit; line-height: 1.4;
  }
  .input-area textarea::placeholder { color: var(--tg-muted); }
  
  .icon-btn {
    background: none; border: none; color: var(--tg-muted);
    font-size: 22px; cursor: pointer; padding: 6px;
    transition: 0.2s; border-radius: 50%;
  }
  .icon-btn:hover { color: #fff; }
  .send-btn {
    background: none; border: none; color: var(--tg-accent);
    cursor: pointer; padding: 6px; display: grid; place-items: center;
    transition: 0.2s;
  }
  .send-btn:hover { color: #fff; transform: scale(1.1); }

  /* ====== МОБИЛЬНАЯ ВЕРСИЯ ====== */
  @media (max-width: 820px) {
    .sidebar { width: 100%; border: none; }
    .chat-area {
      position: absolute; inset: 0; z-index: 20;
      transform: translateX(100%); transition: transform 0.3s ease;
    }
    .app.show-chat .chat-area { transform: translateX(0); }
    .back-btn { display: block; }
    .messages { padding: 16px 12px; }
    .msg { max-width: 85%; }
    .input-area { padding: 8px 10px; }
  }
</style>
</head>
<body>

<div class="app" id="app" style="display:flex; width:100%; height:100%;">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="side-header">
      <button class="menu-btn">☰</button>
      <div style="font-weight:700; font-size:18px; flex:1;">Feroll.IQ</div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск">
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <!-- CHAT -->
  <main class="chat-area">
    <div class="chat-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="avatar" id="headAvatar"></div>
      <div class="ch-info">
        <div class="ch-name" id="headName"></div>
        <div class="ch-status" id="headStatus">в сети</div>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <button class="icon-btn">😊</button>
      <textarea id="input" rows="1" placeholder="Написать сообщение..."></textarea>
      <button class="icon-btn">📎</button>
      <button class="send-btn" id="sendBtn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </main>
</div>

<script>
/* ========== ДАННЫЕ ========== */
const DEFAULTS = [
  { id:'team', name:'Feroll.IQ', status:'официальный канал', online:true, c1:'#6c5ce7', c2:'#00d4ff',
    messages:[
      {t:'Добро пожаловать в Feroll.IQ 👋', out:false, ts:Date.now()-86400000},
      {t:'Здесь ты можешь общаться с друзьями.', out:false, ts:Date.now()-86400000+60000},
      {t:'Пиши — тебе ответят!', out:false, ts:Date.now()-3600000}
    ]},
  { id:'alina', name:'Алина Соколова', status:'в сети', online:true, c1:'#ff6b9d', c2:'#ff9f68',
    messages:[
      {t:'Привет! Как дела?', out:false, ts:Date.now()-7200000},
      {t:'Отлично, а у тебя?', out:true, ts:Date.now()-7100000},
      {t:'Тоже всё хорошо 😊', out:false, ts:Date.now()-7000000}
    ]},
  { id:'maxim', name:'Максим Ветров', status:'был(а) недавно', online:false, c1:'#00c2a8', c2:'#4cd964',
    messages:[ {t:'Скинь файлы по проекту', out:false, ts:Date.now()-5400000} ]},
  { id:'irina', name:'Ирина Ким', status:'в сети', online:true, c1:'#a06bff', c2:'#6c5ce7',
    messages:[ {t:'Встречаемся в 18:00?', out:false, ts:Date.now()-1800000} ]},
  { id:'dmitry', name:'Дмитрий Орлов', status:'был(а) 2 ч назад', online:false, c1:'#ffa62b', c2:'#ff6b6b',
    messages:[ {t:'Спасибо за помощь! 🙏', out:false, ts:Date.now()-172800000} ]}
];

const REPLIES = ['Понял тебя 👌','Согласен!','Хм, интересно 🤔','Давай обсудим','Хорошо, сделаю','Отличная идея! 🔥','Ок, договорились','Ага, всё верно','Сейчас посмотрю','Спасибо!'];

/* ========== СОСТОЯНИЕ ========== */
let state = { chats: DEFAULTS, activeId: 'alina' };
let activeId = state.activeId;
let filter = '';

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getChat = id => state.chats.find(c => c.id === id);
const initials = name => name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const grad = c => `linear-gradient(135deg, ${c.c1}, ${c.c2})`;
const timeOf = ts => { const d = new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); };

/* ========== РЕНДЕР СПИСКА ========== */
function renderList() {
  const list = $('chatList');
  const items = state.chats.filter(c => c.name.toLowerCase().includes(filter.toLowerCase()));
  list.innerHTML = '';
  
  items.forEach(c => {
    const last = c.messages[c.messages.length-1];
    const el = document.createElement('div');
    el.className = 'chat-item' + (c.id === activeId ? ' active' : '');
    el.innerHTML = `
      <div class="avatar" style="background:${grad(c)}">
        ${initials(c.name)}
        ${c.online ? '<span class="dot"></span>' : ''}
      </div>
      <div class="ci-body">
        <div class="ci-top">
          <div class="ci-name">${esc(c.name)}</div>
          <div class="ci-time">${last ? timeOf(last.ts) : ''}</div>
        </div>
        <div class="ci-bottom">
          <div class="ci-last">${last ? (last.out ? 'Вы: ' : '') + esc(last.t) : 'Нет сообщений'}</div>
        </div>
      </div>`;
    el.onclick = () => openChat(c.id);
    list.appendChild(el);
  });
}

/* ========== РЕНДЕР ЧАТА ========== */
function renderChat() {
  const c = getChat(activeId);
  if (!c) return;

  const av = $('headAvatar');
  av.style.background = grad(c);
  av.textContent = initials(c.name);
  $('headName').textContent = c.name;
  $('headStatus').textContent = c.online ? 'в сети' : c.status;

  const box = $('messages');
  box.innerHTML = '';
  c.messages.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.out ? 'out' : 'in');
    d.innerHTML = `${esc(m.t)}<span class="meta">${timeOf(m.ts)}${m.out ? ' <span class="tick">✓✓</span>' : ''}</span>`;
    box.appendChild(d);
  });
  
  if (c.typing) {
    const t = document.createElement('div');
    t.className = 'typing';
    t.innerHTML = '<i></i><i></i><i></i>';
    box.appendChild(t);
  }
  box.scrollTop = box.scrollHeight;
}

/* ========== ДЕЙСТВИЯ ========== */
function openChat(id) {
  activeId = id;
  state.activeId = id;
  renderList();
  renderChat();
  $('app').classList.add('show-chat');
  $('input').focus();
}

function send() {
  const inp = $('input');
  const text = inp.value.trim();
  if (!text) return;
  const c = getChat(activeId);
  if (!c) return;

  c.messages.push({ t: text, out: true, ts: Date.now() });
  inp.value = '';
  inp.style.height = 'auto';
  renderChat();
  renderList();

  // Имитация ответа
  setTimeout(() => {
    const cc = getChat(activeId);
    if (!cc) return;
    cc.typing = true;
    if (activeId === c.id) renderChat();
    
    setTimeout(() => {
      cc.typing = false;
      const reply = REPLIES[Math.floor(Math.random() * REPLIES.length)];
      cc.messages.push({ t: reply, out: false, ts: Date.now() });
      if (activeId === cc.id) renderChat();
      renderList();
    }, 1500);
  }, 600);
}

/* ========== СОБЫТИЯ ========== */
$('sendBtn').onclick = send;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
});
$('searchInput').addEventListener('input', e => {
  filter = e.target.value;
  renderList();
});
$('backBtn').onclick = () => $('app').classList.remove('show-chat');

/* ========== СТАРТ ========== */
renderList();
renderChat();
</script>
</body>
</html>
